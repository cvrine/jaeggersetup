<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração do Dispositivo</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <h2>Configurar Produto</h2>
    <form action="/salvar" method="POST">
        
        <label>Selecione a Rede Wi-Fi:</label>
        <select name="ssid" required>
            <option value="" disabled selected>Escolha uma rede...</option>
            {% for network in networks %}
                <option value="{{ network }}">{{ network }}</option>
            {% endfor %}
        </select>
        
        <label>Senha do Wi-Fi:</label>
        <input type="password" name="password">
        
        <label>ID do Produto:</label>
        <input type="text" name="produto_id" required placeholder="Ex: PRD-001">
        
        <label>Intervalo de Aquisição (segundos):</label>
        <input type="number" name="intervalo" required placeholder="Ex: 60">
        
        <button type="submit">Salvar e Conectar</button>
    </form>
</body>
</html>
